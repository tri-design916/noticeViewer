name: 채용공고 확인

# 실행 시각은 cron-job.org가 09:00, 15:00 KST에 workflow_dispatch로 호출한다.
# (GitHub schedule은 정시에 수 시간 지연·누락되는 일이 있어 쓰지 않는다)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'callback.html']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 게시판 확인 및 알림
        if: github.event_name != 'push'
        run: npm run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 결과 커밋
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 확인"
          git push

      - name: 페이지 파일 준비
        if: always()
        run: mkdir -p _site/data && cp index.html callback.html _site/ && cp data/posts.json _site/data/

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
