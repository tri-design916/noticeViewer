# 초기 점검용 일일 보고. 더 이상 필요 없으면 이 파일만 지우면 된다.
name: 점검 보고

on:
  schedule:
    - cron: '0 1 * * *' # 10:00 KST
  workflow_dispatch:

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 점검 보고 전송
        run: node src/report.js
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_RECEIVER_UUIDS: ${{ secrets.KAKAO_RECEIVER_UUIDS }}

      - name: 재발급된 리프레시 토큰 저장
        if: always() && hashFiles('.kakao_refresh_token') != ''
        run: gh secret set KAKAO_REFRESH_TOKEN < .kakao_refresh_token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
