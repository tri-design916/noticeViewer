# 초기 점검용 일일 보고. 더 이상 필요 없으면 이 파일만 지우면 된다.
name: 점검 보고

# 실행 시각은 cron-job.org가 10:00 KST에 workflow_dispatch로 호출한다.
on:
  workflow_dispatch:

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 점검 보고 전송
        run: node src/report.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
